name: Build for Windows 10/11

on:
  workflow_dispatch:

jobs:
  build-win10-modern:
    name: Build for Windows 10/11
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          # 强制覆盖安装稳定的 PyMuPDF
          pip install pymupdf==1.23.26
          # 【关键】确保安装 opencv-python-headless 和 pyzbar
          pip install opencv-python-headless pyzbar
          
      - name: Verify pyzbar DLLs
        run: |
          # 【诊断】检查 pyzbar DLL 是否存在
          python -c "import pyzbar; import os; pyzbar_dir = os.path.dirname(pyzbar.__file__); dlls = [f for f in os.listdir(pyzbar_dir) if f.endswith('.dll')]; print('pyzbar directory:', pyzbar_dir); print('Found DLLs:', dlls)"
        shell: pwsh
          
      - name: Build Win10 App Folder
        run: |
          # 使用 InvoiceMaster.spec 编译成文件夹模式
          python -m PyInstaller --clean --noconfirm InvoiceMaster.spec
        shell: pwsh
        
      - name: Build Win10 Inno Setup Installer
        run: |
          # 调用 Inno Setup 编译器压制成超高压缩安装包
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc /DOutputFileName="智能发票管理助手_Win10安装包" setup.iss
          } else {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DOutputFileName="智能发票管理助手_Win10安装包" setup.iss
          }
        shell: pwsh

      - name: Upload Win10 Installer Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SmartInvoice_Setup_For_Win10_11
          path: dist_installer/智能发票管理助手_Win10安装包.exe
          retention-days: 1

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.2
          name: "智能发票管理助手 V1.0.2"
          body: "智能发票管理助手最新全平台发布包。"
          files: dist_installer/智能发票管理助手_Win10安装包.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
