name: Build for Windows 10/11

on:
  workflow_dispatch:

jobs:
  build-win10-modern:
    name: Build for Windows 10/11
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          # 强制覆盖安装稳定的 PyMuPDF
          pip install pymupdf==1.23.26
          # 【关键】确保安装 opencv-python-headless 和 pyzbar
          pip install opencv-python-headless pyzbar
          
      - name: Verify pyzbar DLLs
        run: |
          # 【诊断】检查 pyzbar DLL 是否存在
          python -c "import pyzbar; import os; pyzbar_dir = os.path.dirname(pyzbar.__file__); dlls = [f for f in os.listdir(pyzbar_dir) if f.endswith('.dll')]; print('pyzbar directory:', pyzbar_dir); print('Found DLLs:', dlls)"
        shell: pwsh
          
      - name: Build Win10 EXE
        run: |
          # 使用 InvoiceMaster.spec 编译，确保 PyQt6 和 DLL 依赖被正确打包
          python -m PyInstaller --clean --noconfirm InvoiceMaster.spec
          # 重命名生成的可执行文件
          Move-Item dist/智能发票打印助手.exe dist/智能发票管理助手_Win10现代版.exe
        shell: pwsh
        
      - name: Upload Win10 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInvoice_For_Win10_11
          path: dist/智能发票管理助手_Win10现代版.exe
