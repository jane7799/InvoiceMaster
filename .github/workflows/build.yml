name: Build Invoice App All Versions

on:
  workflow_dispatch:  # 仅手动触发，避免每次推送都自动构建

jobs:
  # ==================================================
  # 任务 1: Windows 7 专用版 (含图片资源 + 旧版依赖)
  # ==================================================
  build-win7-legacy:
    name: Build for Windows 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          architecture: 'x64'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # 【关键】锁定 PyMuPDF 版本以防报错
          pip install pdfplumber pandas requests openpyxl pymupdf==1.23.26
          # 【关键】使用 PyQt5 完美支持 Windows 7
          pip install PyQt5 PyQt5-sip
          # 【修复 cv2 报错】安装 OpenCV 和 pyzbar
          pip install opencv-python-headless pyzbar
          pip uninstall -y pathlib || true
          
      - name: Collect pyzbar DLLs
        run: |
          # 【修复 libiconv.dll 报错】收集 pyzbar 的 DLL 依赖
          python -c "import pyzbar; import os; import shutil; pyzbar_dir = os.path.dirname(pyzbar.__file__); dlls = [f for f in os.listdir(pyzbar_dir) if f.endswith('.dll')]; print('Found DLLs:', dlls); [shutil.copy(os.path.join(pyzbar_dir, d), d) for d in dlls]"
          dir *.dll
        shell: pwsh
          
      - name: Build Win7 EXE
        run: |
          python -m pip uninstall -y pathlib || true
          # 获取 pyzbar 路径并收集 DLL
          $pyzbarPath = python -c "import pyzbar; import os; print(os.path.dirname(pyzbar.__file__))"
          $dllArgs = ""
          Get-ChildItem -Path $pyzbarPath -Filter "*.dll" | ForEach-Object {
            $dllArgs += " --add-binary `"$($_.FullName);pyzbar`""
          }
          # 【关键】--add-data 把二维码打包进去 (Windows用分号;)
          # 【关键】--hidden-import 添加 cv2 和 pyzbar 以修复 ModuleNotFoundError
          # 【修复】--add-binary 添加 pyzbar DLL 以修复 libiconv.dll 报错
          $cmd = "python -m PyInstaller --name `"智能发票管理助手_Win7兼容版`" --windowed --onefile --clean --noconfirm --icon=`"logo.ico`" --add-data `"qr1.jpg;.`" --add-data `"qr2.jpg;.`" --add-data `"icon_1x1_l.png;.`" --add-data `"icon_1x1_p.png;.`" --add-data `"icon_1x2_l.png;.`" --add-data `"icon_1x2_p.png;.`" --add-data `"icon_2x2_l.png;.`" --add-data `"icon_2x2_p.png;.`" --hidden-import=cv2 --hidden-import=pyzbar --hidden-import=pyzbar.pyzbar$dllArgs InvoiceMaster.py"
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
        shell: pwsh
          
      - name: Upload Win7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInvoice_For_Win7
          path: dist/智能发票管理助手_Win7兼容版.exe

  # ==================================================
  # 任务 2: Windows 10/11 现代版
  # ==================================================
  build-win10-modern:
    name: Build for Windows 10/11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          # 强制覆盖安装稳定的 PyMuPDF
          pip install pymupdf==1.23.26
          # 【关键】确保安装 opencv-python-headless 和 pyzbar
          pip install opencv-python-headless pyzbar
          
      - name: Verify pyzbar DLLs
        run: |
          # 【诊断】检查 pyzbar DLL 是否存在
          python -c "import pyzbar; import os; pyzbar_dir = os.path.dirname(pyzbar.__file__); dlls = [f for f in os.listdir(pyzbar_dir) if f.endswith('.dll')]; print('pyzbar directory:', pyzbar_dir); print('Found DLLs:', dlls)"
        shell: pwsh
          
      - name: Build Win10 EXE
        run: |
          # 获取 pyzbar 路径并收集 DLL
          $pyzbarPath = python -c "import pyzbar; import os; print(os.path.dirname(pyzbar.__file__))"
          Write-Host "pyzbar path: $pyzbarPath"
          
          $dllArgs = ""
          Get-ChildItem -Path $pyzbarPath -Filter "*.dll" | ForEach-Object {
            Write-Host "Adding DLL: $($_.Name)"
            $dllArgs += " --add-binary `"$($_.FullName);pyzbar`""
          }
          
          # 如果没有找到 DLL，输出警告但继续构建
          if ($dllArgs -eq "") {
            Write-Host "WARNING: No pyzbar DLLs found! QR code scanning may not work."
          }
          
          # Windows 用分号 ;
          # 【关键】添加 --hidden-import 和 --add-binary 以确保 pyzbar 正常工作
          $cmd = "python -m PyInstaller --name `"智能发票管理助手_Win10现代版`" --windowed --onefile --clean --noconfirm --icon=`"logo.ico`" --add-data `"qr1.jpg;.`" --add-data `"qr2.jpg;.`" --add-data `"icon_1x1_l.png;.`" --add-data `"icon_1x1_p.png;.`" --add-data `"icon_1x2_l.png;.`" --add-data `"icon_1x2_p.png;.`" --add-data `"icon_2x2_l.png;.`" --add-data `"icon_2x2_p.png;.`" --hidden-import=cv2 --hidden-import=pyzbar --hidden-import=pyzbar.pyzbar$dllArgs InvoiceMaster.py"
          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
        shell: pwsh
        
      - name: Upload Win10 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInvoice_For_Win10_11
          path: dist/智能发票管理助手_Win10现代版.exe

  # ==================================================
  # 任务 3: macOS 版本
  # ==================================================
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: |
          # 【关键】安装 zbar 系统库，pyzbar 在 macOS 上需要它
          brew install zbar
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install pymupdf==1.23.26
          # 【关键】确保安装 opencv-python-headless 和 pyzbar
          pip install opencv-python-headless pyzbar
          
      - name: Verify pyzbar
        env:
          # 【修复】显式指定动态库路径，让 Python 的 ctypes 能够定位到 Homebrew 安装的 libzbar
          DYLD_LIBRARY_PATH: /opt/homebrew/lib:${{ env.DYLD_LIBRARY_PATH }}
        run: |
          # 【诊断】验证 pyzbar 可以正常导入
          python -c "from pyzbar.pyzbar import decode; print('pyzbar OK')"
          
      - name: Build Mac App
        env:
          # 【修复】确保 PyInstaller 在分析依赖时也能正确加载到 libzbar
          DYLD_LIBRARY_PATH: /opt/homebrew/lib:${{ env.DYLD_LIBRARY_PATH }}
        run: |
          # 提取 libzbar.dylib 的实际路径，将其作为二进制文件直接打进 App 包内
          # 这样可以确保打包出来的 App 即使发给没有装 brew install zbar 的小白用户也能正常打开
          ZBAR_DYLIB=$(find /opt/homebrew/lib -name "libzbar*.dylib" | head -n 1)
          if [ -n "$ZBAR_DYLIB" ]; then
            echo "Found zbar dylib at: $ZBAR_DYLIB"
            BINARY_ARG="--add-binary $ZBAR_DYLIB:."
          else
            echo "WARNING: libzbar dylib not found!"
            BINARY_ARG=""
          fi

          # Mac 用冒号 :
          # 【关键】添加 --hidden-import 和 $BINARY_ARG 确保 pyzbar 及其底层依赖被正确打包
          python -m PyInstaller --name "智能发票管理助手_Mac版" \
            --windowed --clean --noconfirm --icon="logo.icns" \
            --add-data "qr1.jpg:." --add-data "qr2.jpg:." \
            --add-data "icon_1x1_l.png:." --add-data "icon_1x1_p.png:." \
            --add-data "icon_1x2_l.png:." --add-data "icon_1x2_p.png:." \
            --add-data "icon_2x2_l.png:." --add-data "icon_2x2_p.png:." \
            --hidden-import=cv2 --hidden-import=pyzbar --hidden-import=pyzbar.pyzbar \
            $BINARY_ARG \
            InvoiceMaster.py
          
      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInvoice_For_Mac
          path: dist/智能发票管理助手_Mac版*
  # ==================================================
  # 任务 4: Linux/UOS 版本（统信UOS兼容）
  # ==================================================
  build-linux-uos:
    name: Build for Linux/UOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # libzbar0 + libzbar-dev: 用于 pyzbar 二维码扫描
          # libxcb-cursor0: 修复 Qt 光标问题
          # 注意：PyQt6 通过 pip 安装，不使用系统包（兼容性更好）
          sudo apt-get install -y libzbar0 libzbar-dev libxcb-cursor0
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install pymupdf==1.23.26
          # 【关键】确保安装 opencv-python-headless 和 pyzbar
          pip install opencv-python-headless pyzbar
          
      - name: Verify pyzbar
        run: |
          # 【诊断】验证 pyzbar 可以正常导入
          python -c "from pyzbar.pyzbar import decode; print('pyzbar OK')"
          
      - name: Build Linux Binary
        run: |
          # Linux 用冒号 :
          # 【关键】添加 --hidden-import 确保 pyzbar 被正确打包
          python -m PyInstaller --name "智能发票管理助手_Linux版" --onefile --clean --noconfirm --add-data "qr1.jpg:." --add-data "qr2.jpg:." --add-data "icon_1x1_l.png:." --add-data "icon_1x1_p.png:." --add-data "icon_1x2_l.png:." --add-data "icon_1x2_p.png:." --add-data "icon_2x2_l.png:." --add-data "icon_2x2_p.png:." --hidden-import=cv2 --hidden-import=pyzbar --hidden-import=pyzbar.pyzbar InvoiceMaster.py
          
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInvoice_For_Linux_UOS
          path: dist/智能发票管理助手_Linux版