name: Build Invoice App (Windows 7 Only)

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  # ==================================================
  # Windows 7 专用版 (含图片资源 + 旧版依赖 + OpenCV)
  # ==================================================
  build-win7-legacy:
    name: Build for Windows 7
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          architecture: 'x64'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # 【关键】锁定 PyMuPDF 版本以防报错
          pip install pdfplumber pandas requests openpyxl pymupdf==1.23.26
          # 【关键】使用 PyQt5 完美支持 Windows 7
          pip install PyQt5 PyQt5-sip
          # 【修复 cv2 报错】安装 OpenCV 和 pyzbar
          pip install opencv-python-headless pyzbar
          pip uninstall -y pathlib || true
          
      - name: Build Win7 App Folder
        run: |
          python -m pip uninstall -y pathlib || true
          # 使用 InvoiceMaster.spec 编译成文件夹模式（使用 PyQt5）
          python -m PyInstaller --clean --noconfirm InvoiceMaster.spec
        shell: pwsh
        
      - name: Build Win7 Inno Setup Installer
        run: |
          # 调用 Inno Setup 编译器压制成 Win7 专属超高压缩安装包
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc /DOutputFileName="智能发票管理助手_Win7安装包" setup.iss
          } else {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DOutputFileName="智能发票管理助手_Win7安装包" setup.iss
          }
        shell: pwsh
          
      - name: Upload Win7 Installer Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SmartInvoice_Setup_For_Win7
          path: dist_installer/智能发票管理助手_Win7安装包.exe
          retention-days: 1

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.2
          name: "智能发票管理助手 V1.0.2"
          body: "智能发票管理助手最新全平台发布包。"
          files: dist_installer/智能发票管理助手_Win7安装包.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
