name: Build for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: |
          # 【关键】安装 zbar 系统库，pyzbar 在 macOS 上需要它
          brew install zbar
          
      - name: Symlink zbar for ctypes discovery
        run: |
          # 创建 macOS ctypes 默认搜索目录
          mkdir -p ~/lib
          # 动态搜索并建立软链接
          ZBAR_PATH=$(find /opt/homebrew/lib /usr/local/lib -name "libzbar.dylib" 2>/dev/null | head -n 1)
          if [ -n "$ZBAR_PATH" ]; then
            ln -sf "$ZBAR_PATH" ~/lib/libzbar.dylib
            echo "Successfully symlinked $ZBAR_PATH to ~/lib/libzbar.dylib"
          else
            echo "ERROR: libzbar.dylib not found!"
            exit 1
          fi
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          pip install pymupdf==1.23.26
          # 【关键】确保安装 opencv-python-headless 和 pyzbar
          pip install opencv-python-headless pyzbar
          
      - name: Verify pyzbar
        run: |
          # 【诊断】验证 pyzbar 可以正常导入
          python -c "from pyzbar.pyzbar import decode; print('pyzbar OK')"
          
      - name: Build Mac App
        run: |
          # 提取 libzbar.dylib 的实际路径，将其作为二进制文件直接打进 App 包内
          # 这样可以确保打包出来的 App 即使发给没有装 brew install zbar 的用户也能正常打开
          ZBAR_DYLIB=$(find /opt/homebrew/lib /usr/local/lib ~/lib -name "libzbar*.dylib" 2>/dev/null | head -n 1)
          if [ -n "$ZBAR_DYLIB" ]; then
            echo "Found zbar dylib at: $ZBAR_DYLIB"
            BINARY_ARG="--add-binary $ZBAR_DYLIB:."
          else
            echo "WARNING: libzbar dylib not found!"
            BINARY_ARG=""
          fi

          # Mac 用冒号 :
          # 【关键】添加 --hidden-import 和 $BINARY_ARG 确保 pyzbar 及其底层依赖被正确打包
          python -m PyInstaller --name "智能发票管理助手_Mac版" \
            --windowed --clean --noconfirm --icon="logo.icns" \
            --add-data "qr1.jpg:." --add-data "qr2.jpg:." \
            --add-data "icon_1x1_l.png:." --add-data "icon_1x1_p.png:." \
            --add-data "icon_1x2_l.png:." --add-data "icon_1x2_p.png:." \
            --add-data "icon_2x2_l.png:." --add-data "icon_2x2_p.png:." \
            --hidden-import=cv2 --hidden-import=pyzbar --hidden-import=pyzbar.pyzbar \
            $BINARY_ARG \
            InvoiceMaster.py
          
      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartInvoice_For_Mac
          path: dist/智能发票管理助手_Mac版*
